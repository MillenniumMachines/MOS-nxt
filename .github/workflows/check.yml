name: Checks

on:
  push:
    branches:
      - main
      - 'v*.*.*'
      - 'v*.*.*-beta.*'
  pull_request:
    branches:
      - main
      - 'v*.*.*'
      - 'v*.*.*-beta.*'

jobs:
  naming-and-contract:
    name: nxt naming and plugin contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Naming regression guard
        run: |
          chmod +x dist/audit-naming.sh
          ./dist/audit-naming.sh

      - name: Plugin id / path contract
        run: node dist/verify-nxt-plugin-contract.mjs

      - name: Post-processor naming (FreeCAD _post.py)
        run: |
          chmod +x dist/verify-post-processor-naming.sh
          ./dist/verify-post-processor-naming.sh

  macro-line-length:
    name: Macro line length (RRF ≤255)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check macro line lengths
        run: |
          chmod +x dist/check-macro-line-length.sh
          ./dist/check-macro-line-length.sh

  om-global-budget:
    name: OM global size budget (~8KB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check OM global hygiene
        run: node dist/check-om-global-budget.mjs

  g6512-axis-contract:
    name: G6512 single-axis call contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check G6512 callers pass exactly one axis
        run: node dist/check-g6512-axis-contract.mjs

      - name: Check G6512 deflection compensation math
        run: node dist/check-g6512-deflection-math.mjs

  calibration-math:
    name: Calibration math regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check calibration math self-test
        run: node dist/check-calibration-math.mjs

  line-endings:
    name: LF line endings (no CRLF)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tracked files for CR
        run: |
          chmod +x dist/check-line-endings.sh
          ./dist/check-line-endings.sh

  dwc-build-pin:
    name: DWC build pin alignment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned DWC sources
        run: |
          chmod +x dist/ci-fetch-dwc.sh dist/verify-dwc-build-alignment.sh
          dist/ci-fetch-dwc.sh

      - name: Verify ci/dwc-build-ref matches DWC package.json
        run: ./dist/verify-dwc-build-alignment.sh dwc-build
