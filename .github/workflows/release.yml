on:
  push:
    tags:
      - 'v*'
    branches:
      - 'v*.*.*'
  pull_request:
    branches:
      - 'v*.*.*'

name: Build and Release

concurrency:
  group: build-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build NeXT
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'push' && github.ref_name =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/) ||
      (github.event_name == 'pull_request' && github.base_ref =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_ZIP_BASENAME: ${{ startsWith(github.ref, 'refs/tags/') && format('next-release-{0}', github.ref_name) || format('next-build-{0}-{1}', github.event.pull_request.number || github.run_number, github.sha) }}
    steps:
      - name: Checkout NeXT only
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch DWC build sources (read-only tarball)
        run: |
          chmod +x dist/ci-fetch-dwc.sh
          dist/ci-fetch-dwc.sh

      - name: Check RRF macro line lengths
        run: node dist/check-gcode-line-length.mjs

      - name: Build release asset
        run: |
          command -v rsync >/dev/null 2>&1 || {
            apt-get update && apt-get install -y rsync;
          }
          dist/release.sh "${RELEASE_ZIP_BASENAME}" "${{ github.workspace }}/dwc-build"

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: NeXT ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            dist/NeXT-${{ github.ref_name }}.zip
            dist/next-release-${{ github.ref_name }}.zip
            dist/next.cps
            dist/next_post.py
            dist/milo-v1.5-std.mch

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: next-build-${{ github.sha }}
          path: |
            dist/**/*.zip
          if-no-files-found: error
          retention-days: 7
