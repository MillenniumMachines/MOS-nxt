on:
  push:
    tags:
      - 'v*'
    branches:
      - 'v*.*.*'
      - 'v*.*.*-beta.*'
  pull_request:
    branches:
      - 'v*.*.*'
      - 'v*.*.*-beta.*'

name: Build and Release

concurrency:
  group: build-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build NeXT
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_ZIP_BASENAME: ${{ startsWith(github.ref, 'refs/tags/') && format('next-release-{0}', github.ref_name) || format('next-build-{0}-{1}', github.event.pull_request.number || github.run_number, github.sha) }}
    steps:
      - name: Verify semver version branch or v tag
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "Tag build OK: ${GITHUB_REF_NAME}"
            exit 0
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            ref="${GITHUB_BASE_REF}"
          else
            ref="${GITHUB_REF_NAME}"
          fi
          if [[ ! "${ref}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] && \
             [[ ! "${ref}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            echo "::error::Build allowed only on version branches (vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-beta.N) or v* tags; got: ${ref}"
            exit 1
          fi
          echo "Version branch OK: ${ref}"

      - name: Checkout NeXT only
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch DWC build sources (read-only tarball)
        run: |
          chmod +x dist/ci-fetch-dwc.sh
          dist/ci-fetch-dwc.sh

      - name: Check RRF macro line lengths
        run: node dist/check-gcode-line-length.mjs

      - name: Build release asset
        env:
          NXT_BUILD_REF_OVERRIDE: ${{ github.event_name == 'pull_request' && github.base_ref || '' }}
        run: |
          command -v rsync >/dev/null 2>&1 || {
            apt-get update && apt-get install -y rsync;
          }
          dist/release.sh "${RELEASE_ZIP_BASENAME}" "${{ github.workspace }}/dwc-build"

      - name: Load build manifest
        run: |
          set -euo pipefail
          if [[ ! -f dist/build-version.env ]]; then
            echo "::error::dist/build-version.env missing after release.sh" >&2
            exit 1
          fi
          set -a
          # shellcheck source=/dev/null
          source dist/build-version.env
          set +a
          for key in NXT_BUILD_VERSION NXT_PLUGIN_ZIP NXT_SD_ZIP NXT_PP_CPS NXT_PP_PY NXT_PP_MCH; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::${key} not set in build-version.env" >&2
              exit 1
            fi
          done
          {
            echo "NXT_BUILD_VERSION=${NXT_BUILD_VERSION}"
            echo "NXT_PLUGIN_ZIP=${NXT_PLUGIN_ZIP}"
            echo "NXT_SD_ZIP=${NXT_SD_ZIP}"
            echo "NXT_PP_CPS=${NXT_PP_CPS}"
            echo "NXT_PP_PY=${NXT_PP_PY}"
            echo "NXT_PP_MCH=${NXT_PP_MCH}"
          } >> "${GITHUB_ENV}"
          echo "Build version (release line): ${NXT_BUILD_VERSION}"

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: NeXT ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            ${{ env.NXT_PLUGIN_ZIP }}
            ${{ env.NXT_SD_ZIP }}
            ${{ env.NXT_PP_CPS }}
            ${{ env.NXT_PP_PY }}
            ${{ env.NXT_PP_MCH }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: next-build-${{ github.sha }}
          path: |
            dist/**/*.zip
            dist/post-processors/**/*
          if-no-files-found: error
          retention-days: 7
